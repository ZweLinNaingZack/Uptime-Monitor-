# Continuous integration: GitHub runs this on every push to main and on every pull request.
# A red X on the commit means something below failed; click it to see which step and why.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code. Giving it no more access than that limits the damage a
# compromised step could do.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build comes before the type check: it generates the route types (PageProps,
      # LayoutProps) that the type check needs.
      - run: npm run build
      - run: npx tsc --noEmit

  docker:
    # Only worth building once the code itself passes.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      - name: Start them and check they work together
        run: |
          # A throwaway password that exists only inside this CI run.
          echo "ADMIN_PASSWORD=ci-only-password" > backend/.env
          docker compose up --detach --wait
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null http://localhost:3000/login
          # Log in, and use the cookie to list monitors: proves the database migrated.
          curl --fail --silent --cookie-jar cookies.txt -H "Content-Type: application/json" \
            -d '{"password":"ci-only-password"}' http://localhost:8000/auth/login
          curl --fail --silent --cookie cookies.txt http://localhost:8000/monitors
      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down --volumes
